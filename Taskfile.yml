version: "3"

silent: true

vars:
  PY: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'

includes:
  claude: .crepidoma/taskfiles/claude
  lint:
    taskfile: .crepidoma/taskfiles/lint
    vars:
      # Vite output and lane checkouts are not source; the shared eslint config cannot ignore them.
      # frontend/ has its own eslint config (react, jsx-a11y) run by `npm --prefix frontend run lint`;
      # the shared config lacks those plugins and would reject their disable comments.
      LINT_ESLINT: >-
        npx --no-install eslint --ignore-pattern ".worktrees/**" --ignore-pattern ".claude/worktrees/**"
        --ignore-pattern "src/saber_tooth/web/**" --ignore-pattern "frontend/**"
  repo: .crepidoma/taskfiles/repo
  todo: .crepidoma/taskfiles/todo
  git: .crepidoma/taskfiles/git
  graph: .crepidoma/taskfiles/graph
  test: .crepidoma/taskfiles/test
  quality: .crepidoma/taskfiles/quality
  security: .crepidoma/taskfiles/security
  ci: .crepidoma/taskfiles/ci
  rtk: .crepidoma/taskfiles/rtk
  setup: .crepidoma/taskfiles/setup
  st:
    taskfile: ./tasks/Taskfile.yml
    vars: { PY: "{{.PY}}" }
