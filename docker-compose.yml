services:
  saber-tooth:
    build: .
    image: saber-tooth:latest
    ports: ["${SABER_BIND:-127.0.0.1}:${SABER_PORT:-8100}:8100"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      LEVELS_DIR: /levels
      DATA_DIR: /data
      ANALYSER_URL: http://beat-analyser:8000
      ANALYSER_UPLOADS: /analyser
      PLAYLISTS_DIR: ${PLAYLISTS_DIR_HOST:+/playlists}
      GAME_DIR: ${GAME_DIR_HOST:+/game}
      SABER_ALLOWED_HOSTS: ${SABER_ALLOWED_HOSTS:-}
      SABER_TRUSTED_PROXY_IPS: ${SABER_TRUSTED_PROXY_IPS:-}
      VR_AGENT_URL: ${VR_AGENT_URL:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - "${LEVELS_DIR:?set LEVELS_DIR in .env}:/levels"
      - analyser-uploads:/analyser:ro
      - saber-data:/data
      - "${PLAYLISTS_DIR_HOST:-saber-playlists}:/playlists"
      - "${GAME_DIR_HOST:-saber-game}:/game"
    depends_on:
      beat-analyser:
        condition: service_healthy
  beat-analyser:
    image: levialabs/beat-analyser:latest
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      YT_MAX_MINUTES: ${YT_MAX_MINUTES:-20}
    volumes: ["analyser-uploads:/app/uploads"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/folders', timeout=4)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
volumes:
  analyser-uploads:
  saber-data:
  saber-playlists:
  saber-game:
