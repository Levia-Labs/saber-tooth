version: "3"
tasks:
  test:
    desc: "Run the pytest suite. Usage: task st:test [-- <pytest args>]"
    cmds: ["uv run pytest -q {{.CLI_ARGS}}"]
  web:install:
    desc: "Install the frontend dependencies from the lockfile. Usage: task st:web:install"
    dir: "{{.ROOT_DIR}}"
    cmds: ["npm --prefix frontend ci"]
  web:dev:
    desc: "Run the Vite dev server on :5173, proxying /api and /mcp to 127.0.0.1:8100. Usage: task st:web:dev"
    dir: "{{.ROOT_DIR}}"
    cmds: ["npm --prefix frontend run dev -- {{.CLI_ARGS}}"]
  web:build:
    desc: "Type check and build the frontend into src/saber_tooth/web. Usage: task st:web:build"
    dir: "{{.ROOT_DIR}}"
    cmds: ["npm --prefix frontend run build"]
  web:test:
    desc: "Run the frontend Vitest suite. Usage: task st:web:test [-- <vitest args>]"
    dir: "{{.ROOT_DIR}}"
    cmds: ["npm --prefix frontend run test -- {{.CLI_ARGS}}"]
  web:check:
    desc: "Type check, lint and format-check the frontend. Usage: task st:web:check"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - "npm --prefix frontend run typecheck"
      - "npm --prefix frontend run lint"
      - "npm --prefix frontend run format"
  check:
    desc: "Run quality checks on one map folder. Usage: task st:check -- <folder>"
    cmds: ["uv run saber-tooth check {{.CLI_ARGS}}"]
  inspect:
    desc: "Summarise one map folder. Usage: task st:inspect -- <folder>"
    cmds: ["uv run saber-tooth inspect {{.CLI_ARGS}}"]
  autofix:
    desc: "Fix one map offline. Usage: task st:autofix -- <map_folder> --levels <dir> --data <dir> [--max-rounds N]"
    cmds: ["uv run saber-tooth autofix {{.CLI_ARGS}}"]
  survey:
    desc: "Read-only finding counts across a levels dir. Usage: task st:survey -- <levels_dir>"
    cmds: ["uv run saber-tooth survey {{.CLI_ARGS}}"]
  learn:
    desc: "Build lightshow templates. Usage: task st:learn -- <levels_dir> <out.json>"
    cmds: ["uv run saber-tooth learn {{.CLI_ARGS}}"]
  learn-bundle:
    desc: "Regenerate the bundled lightshow set reproducibly. Usage: task st:learn-bundle -- <levels_dir> [--out PATH]"
    cmds: ["uv run python scripts/learn_bundle.py {{.CLI_ARGS}}"]
  up:
    desc: "Build if needed (cached layers reused) and start; keeps containers. Usage: task st:up"
    cmds: ["docker compose up -d --build"]
  stop:
    desc: "Stop the containers, keeping them and volumes. Usage: task st:stop"
    cmds: ["docker compose stop"]
  start:
    desc: "Start stopped containers without rebuilding. Usage: task st:start"
    cmds: ["docker compose start"]
  down:
    desc: "Remove the containers; volumes and images are kept. Usage: task st:down"
    cmds: ["docker compose down"]
  logs:
    desc: "Tail saber-tooth logs. Usage: task st:logs"
    cmds: ["docker compose logs --tail 100 saber-tooth"]
  gen:
    desc: "Start a map generation job from a URL. Usage: task st:gen -- <url>"
    cmds: ["uv run saber-tooth gen-url {{.CLI_ARGS}}"]
  scan:
    desc: "Scan one map through the running API. Usage: task st:scan -- <map_id>"
    cmds: ["uv run saber-tooth scan-api {{.CLI_ARGS}}"]
  readme-check:
    desc: "Check every tracked folder has a README.md. Usage: task st:readme-check [-- --list]"
    cmds: ["uv run python scripts/readme_check.py {{.CLI_ARGS}}"]
  compose-check:
    desc: "Validate docker-compose.yml. Usage: task st:compose-check"
    cmds: ["LEVELS_DIR=${LEVELS_DIR:-./data/levels} docker compose config -q"]
  gate:
    desc: "Run every validation gate, one line each. Usage: task st:gate [-- --only a,b --skip a,b --deep --list]"
    cmds: ["uv run python scripts/gate.py {{.CLI_ARGS}}"]
  review-diff:
    desc: "Write a lockfile-free diff to .cache/reviews. Usage: task st:review-diff -- <range> [--out DIR]"
    cmds: ["uv run python scripts/review_diff.py {{.CLI_ARGS}}"]
  sync:
    desc: "One-line state of every worktree, read-only. Usage: task st:sync [-- --fetch]"
    cmds: ["uv run python scripts/sync.py {{.CLI_ARGS}}"]
  smoke:
    desc: "Smoke-check the running stack, read-only. Usage: task st:smoke [-- --base URL --timeout S]"
    cmds: ["uv run python scripts/smoke.py {{.CLI_ARGS}}"]
  browser-check:
    desc: "Headless browser page check, read-only. Usage: task st:browser-check -- [chrome|firefox] [--base URL]"
    dir: "{{.ROOT_DIR}}"
    cmds: ["node scripts/browser_check.mjs {{.CLI_ARGS}}"]
  lane:
    desc: "Create a work lane worktree. Usage: task st:lane -- <name> [--base main]"
    cmds: ["uv run python scripts/lane.py new {{.CLI_ARGS}}"]
  lane-list:
    desc: "List work lanes. Usage: task st:lane-list"
    cmds: ["uv run python scripts/lane.py list"]
  lane-done:
    desc: "Remove a clean, merged lane. Usage: task st:lane-done CONFIRM=yes -- <name>"
    preconditions:
      - sh: test "{{.CONFIRM}}" = "yes"
        msg: "lane-done deletes a worktree and branch; rerun with CONFIRM=yes"
    cmds: ["CONFIRM=yes uv run python scripts/lane.py done {{.CLI_ARGS}}"]
  commit:
    desc: 'Format, stage and commit exactly the given paths. Usage: task st:commit -- -m "<message>" <paths...>'
    cmds: ["uv run python scripts/commit.py {{.CLI_ARGS}}"]
  crepidoma-bump:
    desc: "Bump the .crepidoma submodule and stage it. Usage: task st:crepidoma-bump [-- <ref>]"
    cmds: ["uv run python scripts/crepidoma_bump.py {{.CLI_ARGS}}"]
  docker-health:
    desc: "State, health and recent logs per compose service. Usage: task st:docker-health"
    cmds: ["uv run python scripts/docker_health.py {{.CLI_ARGS}}"]
