<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>saber-tooth</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/library.css" />
    <link rel="stylesheet" href="/page.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-logo" viewBox="0 0 256 256">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="14">
            <path d="M40 72Q128 38 216 72" />
            <path d="M78 78C68 134 90 182 118 216M178 78C188 134 166 182 138 216" />
          </g>
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5L20.5 20.5" />
        </symbol>
        <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4" /></symbol>
        <symbol id="i-sort-asc" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" /></symbol>
        <symbol id="i-sort-desc" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" /></symbol>
        <symbol id="i-scan" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 12l5.5-5.5M12 7.5a4.5 4.5 0 0 1 4.5 4.5" />
          <circle cx="12" cy="12" r="1" />
        </symbol>
        <symbol id="i-review" viewBox="0 0 24 24">
          <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" />
          <circle cx="12" cy="12" r="2.8" />
        </symbol>
        <symbol id="i-apply" viewBox="0 0 24 24">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <path d="M12 10.5v5M9.5 13h5" />
        </symbol>
        <symbol id="i-approve" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
        <symbol id="i-reject" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
        <symbol id="i-learn" viewBox="0 0 24 24">
          <path d="M9 3.5h6l1.5 4h-9z" />
          <path d="M8 12l-2 8.5M12 11v9.5M16 12l2 8.5" />
        </symbol>
        <symbol id="i-generate" viewBox="0 0 24 24">
          <circle cx="5.5" cy="16" r="2.5" />
          <circle cx="13.5" cy="10" r="2.5" />
          <path d="M8 16V5l8-1.5V10M19 15v6M16 18h6" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" /></symbol>
        <symbol id="i-external" viewBox="0 0 24 24">
          <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
        </symbol>
        <symbol id="i-warning" viewBox="0 0 24 24">
          <path d="M12 3.5L21.5 20h-19z" />
          <path d="M12 10v4.5M12 17.2v.1" />
        </symbol>
        <symbol id="i-error" viewBox="0 0 24 24">
          <path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z" />
          <path d="M12 8v5M12 16.2v.1" />
        </symbol>
        <symbol id="i-ok" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M7.8 12.4l3 3 5.4-6" />
        </symbol>
        <symbol id="i-unscanned" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" stroke-dasharray="3 3.2" />
        </symbol>
        <symbol id="i-unreadable" viewBox="0 0 24 24">
          <path d="M6 3h8l4 4v14H6zM14 3v4h4" />
          <path d="M9.5 12l5 5M14.5 12l-5 5" />
        </symbol>
        <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9" /></symbol>
      </defs>
    </svg>
    <a class="skip" href="#main">Skip to content</a>
    <header class="masthead">
      <a class="brand" href="/" aria-label="saber-tooth, library">
        <svg class="logo" viewBox="0 0 256 256" width="52" height="52" aria-hidden="true">
          <defs>
            <filter id="lg" x="-50%" y="-30%" width="200%" height="160%">
              <feGaussianBlur stdDeviation="7" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <rect width="256" height="256" rx="48" fill="#07070D" />
          <g fill="none" stroke-linecap="round">
            <path d="M40 72Q128 38 216 72" stroke="#8b8ba7" stroke-width="10" />
            <g filter="url(#lg)">
              <path d="M78 78C68 134 90 182 118 216" stroke="#C81414" stroke-width="16" />
              <path d="M178 78C188 134 166 182 138 216" stroke="#288ED2" stroke-width="16" />
            </g>
            <path d="M78 78C68 134 90 182 118 216" stroke="#FF3B3B" stroke-width="9" />
            <path d="M178 78C188 134 166 182 138 216" stroke="#4FC3FF" stroke-width="9" />
            <path
              d="M78 78C68 134 90 182 118 216M178 78C188 134 166 182 138 216"
              stroke="#fff"
              stroke-width="3"
            />
            <path d="M64 72h28M164 72h28" stroke="#2a2a3a" stroke-width="12" />
          </g>
        </svg>
        <span class="wordmark"><span class="red">saber</span>-<span class="blue">tooth</span></span>
      </a>
      <div class="actions-row">
        <a class="btn primary" id="gen-link" href="/new">
          <svg class="ic" aria-hidden="true"><use href="#i-generate" /></svg>
          <span>Generate map</span>
        </a>
        <button type="button" class="btn" id="learn" data-job="1">
          <svg class="ic" aria-hidden="true"><use href="#i-learn" /></svg>
          <span>Learn lightshows</span>
        </button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </header>
    <main id="main" tabindex="-1"></main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
